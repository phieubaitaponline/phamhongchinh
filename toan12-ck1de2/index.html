  }
  /* lưu tiến độ trên máy để tải lại trang thì làm tiếp, không làm lại từ đầu */
  function save(){ if(!attemptId) return; store({attemptId, picks:PICKS, S, cur, t0, done:finished, usedSec}); }
  function progress(){ save(); send(); }
  /* ---------- tạo file .xlsx ngay trong trình duyệt (không cần thư viện) ---------- */
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  function zip(files){ const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
    const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    files.forEach(f=>{ const name=enc.encode(f.name), data=enc.encode(f.data), c=crc32(data);
      const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)];
      const loc=new Uint8Array([...u32(0x04034b50),...common]); parts.push(loc,name,data);
      cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
      off+=loc.length+name.length+data.length; });
    const cenSize=cen.reduce((a,b)=>a+b.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cenSize),...u32(off),...u16(0)]);
    return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); }
  const x=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;};
  function sheetXML(rows,widths){ // rows: [[{v,s}]] ; s: 1=đậm tiêu đề, 2=đậm, 3=xuống dòng
    const cols=widths?'<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>':'';
    const data=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>{ if(c==null)return ''; const o=typeof c==='object'?c:{v:c};
      const ref=col(ci)+(ri+1), st=o.s?` s="${o.s}"`:'';
      return typeof o.v==='number'?`<c r="${ref}"${st}><v>${o.v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(o.v)}</t></is></c>`;}).join('')+'</row>').join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${data}</sheetData></worksheet>`; }
  function xlsx(sheets){ const ns='http://schemas.openxmlformats.org/';
    const files=[
      {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
      {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships"><Relationship Id="rId1" Type="${ns}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
      {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}spreadsheetml/2006/main" xmlns:r="${ns}officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
      {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="${ns}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${ns}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
      {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${ns}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8E3FF"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf fontId="1" applyFont="1"/><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`},

  function download(){

    if(act){ const b=document.createElement('button'); b.className='btn btn-xls'; b.id='xlsBtn'; b.textContent='Tải kết quả (Excel)'; b.onclick=download; act.insertBefore(b,act.firstChild);
    }
    if(act&&REPORT_URL&&REPORT_URL.indexOf('http')===0){ const g=document.createElement('div'); g.className='gui-tt'; g.id='guiTT'; g.dataset.id=attemptId; act.parentNode.insertBefore(g,act); }
    progress(); }
  function prefill(){ // trong LMS: lấy sẵn tên học sinh
    const ln=SCORM.get('cmi.learner_name','cmi.core.student_name'); if(!ln) return;
    const nm=ln.indexOf(',')>0?ln.split(',').map(s=>s.trim()).reverse().join(' '):ln;
    if(!student().name) localSet('rp_name',nm); const el=document.getElementById('rpName'); if(el&&!el.value) el.value=nm; }
  return {introForm,guardStart,onResult,prefill,download,build,progress,save};
})();
window.addEventListener('load',()=>{ REPORT.prefill(); });

/* ================= v4.2: GIỮ KHUNG HÌNH Ở NỘI DUNG BÀI ================= */
function _khung(){ const sb=document.querySelector('.statusbar'), hd=document.querySelector('header.topbar'), card=app.querySelector('.qcard');
  return {sb, sbH:(sb?sb.offsetHeight:0), hdH:(hd?hd.offsetHeight:0), card}; }
function _dichKhung(){ const k=_khung(); let top=k.hdH;                    // thanh tiến trình nằm ngay dưới tên bài
  if(window.matchMedia('(max-width:760px)').matches && k.card) top=k.card.getBoundingClientRect().top+window.scrollY-k.sbH-8;
  return Math.max(0,Math.round(top)); }
function ganKhung(smooth){ if(phase!=='quiz') return;
  const t=_dichKhung(); window.scrollTo({top:t, behavior:smooth?'smooth':'auto'});
  setTimeout(()=>{ if(phase!=='quiz') return; const t2=_dichKhung(); if(Math.abs(t2-t)>4) window.scrollTo({top:t2, behavior:'auto'}); }, 420); }
/* số có nhiều chữ số (2 000 000) không bị ngắt xuống dòng giữa các nhóm: đổi dấu cách thành dấu cách không ngắt khi hiển thị */
function giuSo(root){ const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const t=n.nodeValue; if(/\d \d{3}/.test(t)) n.nodeValue=t.replace(/(\d) (?=\d{3}(?!\d))/g,'$1\u00A0'); } }
new MutationObserver(()=>giuSo(app)).observe(app,{childList:true, subtree:true});
function hienPhanHoi(){ if(phase!=='quiz') return;
  setTimeout(()=>{ const k=_khung(); if(!k.card) return; const r=k.card.getBoundingClientRect();
    const want=r.bottom-window.innerHeight+16; if(want<=0) return;
    const fb=k.card.querySelector('.fb'); const lim=(fb?fb.getBoundingClientRect().top:r.top)-k.sbH-10;
    const d=Math.min(want, lim); if(d>0) window.scrollBy({top:d, behavior:'smooth'}); }, 60); }
renderIntro();
</script>
<script>
/* ================= DẠNG CÂU MỚI TOÁN 12: bấm vùng trên hình (pick-region) =================
   Dữ liệu: q.img (tệp ảnh), q.vb [rộng, cao] (toạ độ ảnh), q.regions [{k, d (đường SVG), label}], q.answer [k...] (đã sắp xếp), q.multi.
   Chỉ THÊM vào engine TO5 bằng cách bọc hàm, không sửa hàm gốc. */
(function(){
const T7=['pick-region'];
TYPE_LABEL['pick-region']='Bấm vùng trên hình';
const lab=(q,k)=>{const r=q.regions.find(x=>x.k===k); return r?r.label:k;};
const _initV=initV; initV=function(q){ return q.type==='pick-region'?[]:_initV(q); };
const _cell=cellResults; cellResults=function(q,v){
  if(q.type==='pick-region') return [v.length===q.answer.length&&q.answer.every(a=>v.includes(a))];
  return _cell(q,v); };
const _isC=isCorrect; isCorrect=function(q,v){ return T7.includes(q.type)?cellResults(q,v).every(Boolean):_isC(q,v); };
const _miss=missing; missing=function(q,v){
  if(q.type==='pick-region') return v.length?'':'Em hãy bấm vào hình để chọn nhé.';
  return _miss(q,v); };
const _ans=answerText; answerText=function(q){
  if(q.type==='pick-region') return q.answer.map(k=>lab(q,k)).join(', ');
  return _ans(q); };
const _mw=markWrong; markWrong=function(q,s){ if(!T7.includes(q.type))return _mw(q,s);
  s.marks={w:1}; s.v.filter(k=>!q.answer.includes(k)).forEach(k=>s.marks['x'+k]=1); s.v=s.v.filter(k=>q.answer.includes(k)); };

const _body=body; body=function(i){ const q=QUIZ_DATA[i]; if(!T7.includes(q.type)) return _body(i);
  const s=S[i], v=s.v, lk=locked(i), fin=s.status==='fail', okAll=s.status==='ok1'||s.status==='ok2';
  const W=q.vb[0], H=q.vb[1];
  let h=`<div class="pr-wrap${lk?' locked':''}${s.marks.w?' wrong':''}" style="aspect-ratio:${W}/${H};max-width:${Math.min(720,Math.round(430*W/H))}px">`;
  h+=`<img src="${q.img}" alt="${escA(ALT[q.img]||'Hình vẽ')}">`;
  h+=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Các vùng bấm trên hình">`;
  q.regions.forEach(r=>{ const on=v.includes(r.k); let c='';
    if(okAll) c=on?'ok':''; else if(fin) c=q.answer.includes(r.k)?'ok':(on?'bad':''); else c=on?'sel':(s.marks['x'+r.k]?'bad':'');
    h+=`<path class="pr ${c}" d="${r.d}" ${lk?'':'data-act="pr"'} data-k="${r.k}" tabindex="${lk?-1:0}" role="button" aria-pressed="${on}" aria-label="${escA(r.label)}"><title>${escRaw(r.label)}</title></path>`; });
  h+=`</svg></div>`;
  h+=`<p class="pr-chon">${v.length?'Em đã chọn: '+v.map(k=>esc(lab(q,k))).join(', '):'Em chưa chọn vùng nào.'}</p>`;
  if(!lk) h+=`<p class="note">${q.multi?'Bấm vào các vùng trên hình để chọn (bấm lại để bỏ chọn).':'Bấm vào một vùng trên hình để chọn (bấm vùng khác để đổi).'}</p>`;
  return h; };

app.addEventListener('click',e=>{
  if(phase!=='quiz'||view!==cur||locked(cur))return; const a=e.target.closest('[data-act="pr"]'); if(!a)return;
  const q=QUIZ_DATA[cur], s=S[cur]; if(q.type!=='pick-region')return; change();
  const k=a.dataset.k, j=s.v.indexOf(k);
  if(q.multi){ j<0?s.v.push(k):s.v.splice(j,1); } else { s.v=(j<0)?[k]:[]; }
  delete s.marks.w; delete s.marks['x'+k]; renderQuestion(); });
app.addEventListener('keydown',e=>{ const a=e.target.closest&&e.target.closest('[data-act="pr"]'); if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault(); a.dispatchEvent(new MouseEvent('click',{bubbles:true}));} });
})();
</script>

<script>
/* ================= CHẾ ĐỘ ĐỀ THI TỐT NGHIỆP THPT (từ 2025) – Toán 12, 16/11/2026 =================
   Phần I 12 câu chọn 1 (0,25 đ) · Phần II 4 câu Đúng/Sai 4 ý (1 ý 0,1 · 2 ý 0,25 · 3 ý 0,5 · 4 ý 1 đ) · Phần III 6 câu trả lời ngắn (0,5 đ).
   Không chấm từng câu; chuyển câu tự do; nộp bài mới chấm. Dữ liệu câu: q.phan ('I'|'II'|'III'), q.points_first = điểm tối đa của câu. */
const THPT=(function(){
const DS_DIEM=[0,0.1,0.25,0.5,1];
const PHAN={I:{ten:'Phần I · Chọn 1 đáp án',ngan:'Phần I',part:'nhan-biet'},II:{ten:'Phần II · Đúng/Sai',ngan:'Phần II',part:'thong-hieu'},
            III:{ten:'Phần III · Trả lời ngắn',ngan:'Phần III',part:'van-dung'}};
const r2=x=>Math.round((x+1e-9)*100)/100;
const fmt=x=>r2(x).toFixed(2).replace(/0+$/,'').replace(/\.$/,'').replace('.',',');
GROUPS.length=0;
QUIZ_DATA.forEach((q,i)=>{let g=GROUPS[GROUPS.length-1]; if(!g||g.phan!==q.phan){g={part:PHAN[q.phan].part,phan:q.phan,idx:[]};GROUPS.push(g);} g.idx.push(i);});
function so(x){ const t=String(x==null?'':x).replace(/[\s ]/g,'').replace(/[−–—]/g,'-').replace(',','.');
  return /^[-+]?\d+(\.\d+)?$/.test(t)?parseFloat(t):NaN; }
function daLam(i){ const q=QUIZ_DATA[i], s=S&&S[i]; if(!s)return 0; const v=s.v;
  if(q.type==='truefalse-grid'){ const n=q.rows.filter((_,k)=>v&&(v[k]===true||v[k]===false)).length; return n===q.rows.length?2:n?1:0; }
  if(q.type==='number-fill') return v&&String(v[0]||'').trim()?2:0;
  if(Array.isArray(v)) return v.length?2:0;
  return v==null?0:2; }
function soDaLam(){ return QUIZ_DATA.filter((_,i)=>daLam(i)===2).length; }
function cham(){ QUIZ_DATA.forEach((q,i)=>{ const s=S[i]; s.att=1; s.msg=''; s.marks={};
  if(q.type==='truefalse-grid'){ const v=s.v||{}; s.dsk=q.rows.filter((r,k)=>v[k]===r.answer).length; s.status=s.dsk===q.rows.length?'ok1':'fail';
    q.rows.forEach((r,k)=>{ if(v[k]!==r.answer) s.marks['r'+k]=1; }); }
  else if(q.type==='number-fill'){ const a=so(s.v&&s.v[0]), b=so(q.answer[0]); s.status=(!isNaN(a)&&Math.abs(a-b)<1e-9)?'ok1':'fail'; }
  else s.status=(s.v!=null&&isCorrect(q,s.v))?'ok1':'fail'; }); }
function diemCau(i){ const q=QUIZ_DATA[i], s=S&&S[i]; if(!s||!s.status)return 0;
  if(q.type==='truefalse-grid') return DS_DIEM[Math.min(s.dsk||0,4)]; return s.status==='ok1'?q.points_first:0; }
points=diemCau;                                   // REPORT.build, closeCourse dùng điểm theo quy tắc THPT
check=function(){ if(cur<N-1){ stopAudio(); cur++; view=cur; picked=null; renderQuestion(); ganKhung(true); } };   // Enter ở ô điền số: sang câu sau, không chấm

const _rq=renderQuestion;
renderQuestion=function(){ _rq(); if(phase!=='quiz') return;
  const i=view, q=QUIZ_DATA[i]; document.body.className='part-'+PHAN[q.phan].part;
  const qb=app.querySelector('.qbody'); if(!qb) return;
  qb.querySelectorAll('.fb,.hint,.explain,.review-bar').forEach(e=>e.remove());
  qb.querySelectorAll('table.tf tr:first-child th:first-child').forEach(th=>{ th.textContent='Ý'; });
  const act=qb.querySelector('.actions');
  if(act){ act.innerHTML=(i>0?'<button class="btn btn-next" data-act="tp-prev">← Câu trước</button>':'')+
      (i<N-1?'<button class="btn btn-main" data-act="tp-next">Câu tiếp →</button>':'<button class="btn btn-main" data-act="tp-nop">Nộp bài</button>');
    if(i<N-1) act.insertAdjacentHTML('afterend','<div class="tp-nopnho"><button class="btn-nop" data-act="tp-nop">Nộp bài</button></div>'); }
  const tag=app.querySelector('.qhead .tag'); if(tag) tag.textContent=PHAN[q.phan].ngan+' · '+String(q.instruction||'').replace(/\.\s*$/,'');
  document.getElementById('countPill').textContent='Câu '+(i+1)+' / '+N;
  document.getElementById('progBar').style.width=(soDaLam()/N*100)+'%';
  updateNav(); luu(); };
function luu(){ try{ if(REPORT.save) REPORT.save(); }catch(e){} }      // lưu bài đang làm trên máy (tải lại trang làm tiếp) – không gửi
let hen=null;
app.addEventListener('input',()=>{ if(phase!=='quiz') return; clearTimeout(hen);
  hen=setTimeout(()=>{ document.getElementById('progBar').style.width=(soDaLam()/N*100)+'%'; updateNav(); luu(); },300); });
const _un=updateNav;
updateNav=function(){ _un(); if(phase!=='quiz') return;
  QUIZ_DATA.forEach((q,i)=>{ const b=navEl.querySelector('[data-go="'+i+'"]'); if(!b) return; const d=daLam(i);
    b.className='cell'+(d===2?' tp-xong':d===1?' tp-do':'')+(i===cur?' now':''); b.disabled=false; b.removeAttribute('aria-disabled');
    b.setAttribute('aria-label','Câu '+(i+1)+(d===2?' – đã trả lời':d===1?' – trả lời chưa đủ ý':' – chưa trả lời')); });
  GROUPS.forEach((g,gi)=>{ const sc=navEl.querySelector('[data-sc="'+gi+'"]'); if(sc) sc.textContent=g.idx.filter(i=>daLam(i)===2).length+'/'+g.idx.length;
    const h=navEl.querySelector('[data-g="'+gi+'"] .grp-h span'); if(h) h.textContent=PHAN[g.phan].ten; });
  const lab=document.getElementById('navtoglab'); if(lab) lab.textContent='Danh sách câu · đã trả lời '+soDaLam()+'/'+N;
  const nb=document.getElementById('navbody'); if(nb&&!nb.querySelector('.tp-navnop')) nb.insertAdjacentHTML('beforeend','<div class="tp-navnop"><button class="btn-nop" data-tp-nop="1">Nộp bài</button></div>'); };
function di(i){ stopAudio(); cur=i; view=i; picked=null; renderQuestion(); ganKhung(true); }
document.addEventListener('click',e=>{ if(phase!=='quiz') return;
  if(e.target.closest('[data-tp-nop]')){ e.preventDefault(); e.stopPropagation(); hoiNop(); return; }
  const b=e.target.closest('#qnav [data-go]'); if(!b) return; e.preventDefault(); e.stopPropagation();
  if(window.matchMedia('(max-width:1040px)').matches) navEl.classList.remove('open'); di(+b.dataset.go); },true);
app.addEventListener('click',e=>{ if(phase!=='quiz') return; const a=e.target.closest('[data-act^="tp-"]'); if(!a) return;
  const k=a.dataset.act; if(k==='tp-nop'){ hoiNop(); return; }
  if(k==='tp-next'&&cur<N-1) di(cur+1); else if(k==='tp-prev'&&cur>0) di(cur-1); });
function hoiNop(){ if(document.querySelector('.tp-xn')) return;
  const thieu=QUIZ_DATA.map((_,i)=>daLam(i)===2?-1:i).filter(i=>i>=0);
  const d=document.createElement('div'); d.className='tp-xn'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<div class="tp-hop"><h3>Nộp bài?</h3><p>'+(thieu.length?'Em còn <b>'+thieu.length+'</b> câu chưa trả lời hoặc chưa đủ ý (câu '+thieu.map(i=>i+1).join(', ')+').'
    :'Em đã trả lời đủ '+N+' câu.')+'</p><p>Sau khi nộp, bài được chấm và em không sửa được nữa.</p><div class="tp-nut"><button class="btn btn-next" data-x="0">Làm tiếp</button><button class="btn btn-main" data-x="1">Nộp bài</button></div></div>';
  document.body.appendChild(d);
  d.addEventListener('click',e=>{ const b=e.target.closest('[data-x]'); if(!b&&e.target!==d) return; d.remove(); if(b&&b.dataset.x==='1') nop(); });
  const nb=d.querySelector('[data-x="1"]'); if(nb) nb.focus(); }
function nop(){ if(phase!=='quiz') return; cham(); cur=N-1; view=cur; showResult(); }

const nhanDS=v=>v===true?'Đúng':v===false?'Sai':'(bỏ trống)';
const giai=t=>esc(t).replace(/\n/g,'<br>');
function xemLai(i){ const q=QUIZ_DATA[i], s=S[i], d=diemCau(i), tt=s.status==='ok1'?'ok':(q.type==='truefalse-grid'&&s.dsk>0?'mot-phan':'sai');
  let h='<div class="tp-rv '+tt+'"><div class="tp-rvh"><b>Câu '+q.no+'</b><span>· '+PHAN[q.phan].ngan+'</span><span class="tp-d">'+fmt(d)+' / '+fmt(q.points_first)+' điểm</span></div><div class="tp-de">'+deBai(q)+'</div>';
  if(q.assets.images.length) h+='<div class="imgrow">'+q.assets.images.map(f=>media(f,'scene',ALT[f]||'Hình minh hoạ')).join('')+'</div>';
  if(q.type==='truefalse-grid'){ const v=s.v||{};
    h+='<table class="tp-ds"><tr><th>Ý</th><th class="c">Em chọn</th><th class="c">Đáp án</th></tr>'+q.rows.map((r,k)=>{ const ok=v[k]===r.answer;
      return '<tr class="'+(ok?'dung':'sai')+'"><td>'+esc(r.text)+'</td><td class="c em">'+nhanDS(v[k])+' '+(ok?'✓':'✗')+'</td><td class="c">'+(r.answer?'Đúng':'Sai')+'</td></tr>'; }).join('')+
      '</table><p class="tp-bt">Đúng '+(s.dsk||0)+'/4 ý → '+fmt(d)+' điểm.</p>'; }
  else if(q.type==='number-fill'){ const g=String((s.v||[])[0]||'').trim();
    h+='<p class="tp-tl">Em điền: <span class="'+(s.status==='ok1'?'dung':'sai')+'">'+(g?escRaw(g):'(bỏ trống)')+'</span> · Đáp số đúng: <b>'+esc(q.answer[0])+'</b></p>'; }
  else { h+='<ul class="tp-pa">'+q.options.map(o=>{ const c=q.answer.includes(o.id)?'dung':(s.v===o.id?'chon-sai':'');
      return '<li class="'+c+'"><b>'+o.id+'.</b> '+esc(o.text)+(s.v===o.id?' <i>(em chọn)</i>':'')+'</li>'; }).join('')+'</ul>'+(s.v==null?'<p class="tp-bt">Em chưa chọn đáp án.</p>':''); }
  return h+'<div class="explain tp-giai"><b>Hướng dẫn giải</b><br>'+giai(q.feedback_full)+'</div></div>'; }
showResult=function(){
  phase='result'; stopAudio(); navEl.innerHTML=''; usedSec=Math.round((Date.now()-t0)/1000);
  if(S.some(x=>!x.status)) cham();
  const diem=r2(S.reduce((a,_,i)=>a+diemCau(i),0)), nOk=S.filter(x=>x.status==='ok1').length;
  const rows=['I','II','III'].map(p=>{ const idx=QUIZ_DATA.map((q,i)=>q.phan===p?i:-1).filter(i=>i>=0); if(!idx.length) return '';
    const d=idx.reduce((a,i)=>a+diemCau(i),0), td=idx.reduce((a,i)=>a+QUIZ_DATA[i].points_first,0);
    const kq=p==='II'?idx.reduce((a,i)=>a+(S[i].dsk||0),0)+'/'+(idx.length*4)+' ý đúng':idx.filter(i=>S[i].status==='ok1').length+'/'+idx.length+' câu đúng';
    return '<tr><td>'+PHAN[p].ten+'</td><td>'+kq+'</td><td class="num">'+fmt(d)+' / '+fmt(td)+'</td></tr>'; }).join('');
  let stars=0; if(diem>=8)stars=3; else if(diem>=6.5)stars=2; else if(diem>=5)stars=1;
  const label=['Cố lên nhé!','Khá lắm!','Giỏi lắm!','Tuyệt vời!'][stars];
  const mm=Math.floor(usedSec/60), ss=usedSec%60;
  document.body.className='part-nhan-biet';
  document.getElementById('countPill').textContent='Đã nộp bài'; document.getElementById('progBar').style.width='100%';
  app.innerHTML='<section class="qcard"><div class="qhead"><div class="q-en">Kết quả bài làm</div></div><div class="qbody">'+
    '<div class="res-top"><div class="loi-chuc">Thầy Chính chúc mừng em đã hoàn thành bài tập!</div><div class="big-stars">'+'★★★☆☆☆'.substr(3-stars,3)+'</div><div class="star-label">'+label+'</div>'+
    '<div class="big">'+fmt(diem)+'<small> / 10 điểm</small></div><div class="meta">Đúng trọn vẹn '+nOk+'/'+N+' câu · Thời gian làm bài: '+mm+' phút '+ss+' giây</div></div>'+
    '<div class="res-block" style="margin-top:18px"><h4>Điểm từng phần</h4><table><tr><th>Phần</th><th>Kết quả</th><th>Điểm</th></tr>'+rows+
    '<tr class="tong"><td>Tổng</td><td>'+nOk+'/'+N+' câu đúng trọn vẹn</td><td class="num">'+fmt(diem)+' / 10</td></tr></table></div>'+
    '<div class="res-block" style="margin-top:18px"><h4>Xem lại bài làm và hướng dẫn giải</h4>'+QUIZ_DATA.map((_,i)=>xemLai(i)).join('')+'</div>'+
    '<div class="actions"><button class="btn btn-end" id="endBtn">Kết thúc</button></div></div></section>';
  document.getElementById('endBtn').onclick=closeCourse;
  sfx('sfxDone'); window.scrollTo({top:0,behavior:'smooth'});
  if(!reported){ reported=true; SCORM.report(diem,10,usedSec,''); }
  REPORT.onResult(); };
return {cham,diemCau,daLam,nop,hoiNop,so};
})();
</script>
